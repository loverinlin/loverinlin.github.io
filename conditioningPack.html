<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旺福</title>
  <link rel="stylesheet" href="./css/index.css">
</head>

<body>
  <div class="header">
    <img src="./image/conditioningPack/header.webp">
  </div>
  <div id="content" class="content conditioningPack">
    <div class="tab__row">
      <div class="tab pink active" data-tab="0">
        <img class="tab__icon" src='./image/conditioningPack/rice.webp'></img>
        <div class="tab__title">全部</div>
      </div>
      <div class="tab pink" data-tab="1">
        <img class="tab__icon" src='./image/conditioningPack/food.webp'></img>
        <div class="tab__title">方便均衡</div>
        <div class="tab__title tab__title--sm">(主食+部分蔬菜)</div>
      </div>
      <div class="tab blue" data-tab="2">
        <img class="tab__icon" src='./image/conditioningPack/fish.webp'></img>
        <div class="tab__title">純主菜類</div>
        <div class="tab__title tab__title--sm">(蛋白質)</div>
      </div>
      <div class="tab orange" data-tab="3">
        <img class="tab__icon" src='./image/conditioningPack/staple.webp'></img>
        <div class="tab__title">純主食類</div>
        <div class="tab__title tab__title--sm">(全榖雜糧)</div>
      </div>
      <div class="tab green" data-tab="4">
        <img class="tab__icon" src='./image/conditioningPack/vegetable.webp'></img>
        <div class="tab__title">冷凍蔬菜類</div>
      </div>
    </div>
    <div id="tab__content" class="tab__content cmdtList">

    </div>
  </div>
  </div>
  <div class="footer">
    <img src="./image/conditioningPack/footer.webp">
  </div>
  <script type="module" src="./js/conditioningPack.js"></script>
</body>

</html>
